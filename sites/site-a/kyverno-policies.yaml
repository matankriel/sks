# Site-level shared values for kyverno-policies.
# Override per-cluster in sites/<site>/<cluster>/kyverno-policies.yaml.
policies:
  excludeNamespaces: {}   # placeholder — override to add site-wide namespace exclusions

  routeDnsManagement:
    enabled: true
    siteName: "site-a"
    baseDomain: "example.com"   # placeholder — replace with real base domain
    cname:
      ttl: 300
      providerConfigRef: "dns-default"   # placeholder — set per-site if different
