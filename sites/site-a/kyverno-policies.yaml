# Site-level shared values for kyverno-policies.
# Override per-cluster in sites/<site>/<cluster>/kyverno-policies.yaml.
policies:
  excludeNamespaces: {}   # placeholder — override to add site-wide namespace exclusions

  routeDnsManagement:
    enabled: true
    siteName: "site-a"
    baseDomain: "example.com"   # placeholder — replace with real base domain
    cname:
      apiVersion: "dns.crossplane.io/v1alpha1"   # placeholder — update to your Crossplane DNS provider CRD
      kind: "Record"                              # placeholder — update to your Crossplane DNS provider CRD kind
      namespace: "crossplane-system"
      ttl: 300
