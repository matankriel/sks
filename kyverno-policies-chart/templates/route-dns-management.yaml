{{- if .Values.policies.routeDnsManagement.enabled }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: route-dns-management
  annotations:
    policies.kyverno.io/title: Route DNS Management
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      On Route creation, rewrites spec.host to the site-stable pattern
      (<name>-<namespace>.apps.<site>.<baseDomain>) so the route is not
      bound to a specific cluster. Also generates a Crossplane CNAME record
      pointing the stable site hostname to the current cluster's hostname,
      enabling workload mobility between clusters in the same site.
spec:
  background: false
  rules:

    # ── Rule 1: Rewrite the route hostname to the site-stable pattern ──────────
    - name: mutate-route-host
      match:
        any:
          - resources:
              kinds:
                - route.openshift.io/v1/Route
              operations:
                - CREATE
      exclude:
        any:
          - resources:
              namespaces:
              {{- range .Values.policies.excludeNamespaces.exact }}
                - {{ . | quote }}
              {{- end }}
              {{- range .Values.policies.excludeNamespaces.wildcards }}
                - {{ . | quote }}
              {{- end }}
      mutate:
        patchStrategicMerge:
          spec:
            # Result: <name>-<namespace>.apps.<siteName>.<baseDomain>
            host: "{{`{{ join('', [request.object.metadata.name, '-', request.object.metadata.namespace]) }}`}}.apps.{{ .Values.policies.routeDnsManagement.siteName }}.{{ .Values.policies.routeDnsManagement.baseDomain }}"

    # ── Rule 2: Generate a Crossplane CNAME record ─────────────────────────────
    #   CNAME: <name>-<namespace>.apps.<site>.<domain>
    #     → <name>-<namespace>.apps.<cluster>.<domain>
    - name: generate-cname-record
      match:
        any:
          - resources:
              kinds:
                - route.openshift.io/v1/Route
              operations:
                - CREATE
      exclude:
        any:
          - resources:
              namespaces:
              {{- range .Values.policies.excludeNamespaces.exact }}
                - {{ . | quote }}
              {{- end }}
              {{- range .Values.policies.excludeNamespaces.wildcards }}
                - {{ . | quote }}
              {{- end }}
      generate:
        apiVersion: record.dns-v2.crossplane.io/v1alpha1
        kind: CNAMERecord
        name: "{{`{{ join('', [request.object.metadata.name, '-', request.object.metadata.namespace]) }}`}}"
        namespace: "{{`{{ request.object.metadata.namespace }}`}}"
        synchronize: true
        data:
          metadata:
            annotations:
              crossplane.io/external-name: "{{`{{ join('', [request.object.metadata.name, '-', request.object.metadata.namespace]) }}`}}"
          spec:
            deletionPolicy: Delete
            forProvider:
              # Relative subdomain — Crossplane appends zone to form full FQDN
              name: "{{`{{ join('', [request.object.metadata.name, '-', request.object.metadata.namespace]) }}`}}.apps.{{ .Values.policies.routeDnsManagement.siteName }}"
              # Current cluster hostname (CNAME target) — full FQDN
              cname: "{{`{{ join('', [request.object.metadata.name, '-', request.object.metadata.namespace]) }}`}}.apps.{{ .Values.policies.routeDnsManagement.clusterName }}.{{ .Values.policies.routeDnsManagement.baseDomain }}"
              ttl: {{ .Values.policies.routeDnsManagement.cname.ttl }}
              zone: {{ .Values.policies.routeDnsManagement.baseDomain }}
            managementPolicies:
              - '*'
            providerConfigRef:
              name: {{ .Values.policies.routeDnsManagement.cname.providerConfigRef }}
{{- end }}
